    <circle cx="37" cy="21" r="4.8" fill="#34d6a3"/>
    <text x="76" y="26" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#ffffff" letter-spacing="-0.4">ClickIT</text>
    <text x="76" y="48" font-family="Segoe UI, Arial, sans-serif" font-size="27" font-weight="800" fill="#34d6a3" letter-spacing="-0.4">Solutions</text>
    <text x="232" y="40" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="700" fill="#8ea0bd" letter-spacing="4">TANZANIA</text>
  </g>

  <text x="80" y="272" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-2.2">Build technology that</text>
  <text x="80" y="352" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" fill="url(#jade)" letter-spacing="-2.2">moves your business</text>
  <text x="80" y="432" font-family="Segoe UI, Arial, sans-serif" font-size="70" font-weight="800" fill="#ffffff" letter-spacing="-2.2">forward.</text>

  <path d="M80 458C240 470 520 470 700 462" stroke="url(#jade)" stroke-width="4" stroke-linecap="round" fill="none" opacity="0.65"/>

  <text x="80" y="522" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#a9b6cc">Custom software, mobile apps and business automation</text>
  <text x="80" y="558" font-family="Segoe UI, Arial, sans-serif" font-size="25" font-weight="400" fill="#a9b6cc">built around the way your business works.</text>

  <g transform="translate(80,592)">
